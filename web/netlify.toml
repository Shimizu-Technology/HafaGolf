# Effective Netlify configuration when build.base = "web".
# Keep in sync with repository-root netlify.toml.
[build]
  command = "npm run build"
  publish = "dist"
  ignore = "bash ../scripts/netlify-ignore-build.sh"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
