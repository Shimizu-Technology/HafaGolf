<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- Primary Meta Tags (overridden dynamically per tenant/tournament at runtime) -->
    <title>HafaGolf | Golf Tournament Platform</title>
    <meta name="title" content="HafaGolf | Golf Tournament Platform" />
    <meta name="description" content="Online registration, sponsorships, check-in, digital raffles, and live leaderboards for golf tournaments." />
    <meta name="robots" content="index, follow" />

    <!-- Favicon & Icons -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />

    <!-- PWA Meta Tags -->
    <meta name="theme-color" content="#0f766e" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="HafaGolf" />
    <meta name="application-name" content="HafaGolf" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="HafaGolf | Golf Tournament Platform" />
    <meta property="og:description" content="Online registration, sponsorships, check-in, digital raffles, and live leaderboards for golf tournaments." />
    <meta property="og:locale" content="en_US" />

    <!-- Preconnect to external origins -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Curated Fonts: Plus Jakarta Sans + DM Sans + Lora + Playfair Display (for Theme Packs) -->
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Lora:wght@500;600;700&family=Playfair+Display:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  </head>
  <body>
    <noscript>
      <div style="padding: 20px; text-align: center; font-family: sans-serif;">
        <h1>JavaScript Required</h1>
        <p>Please enable JavaScript to use this tournament site.</p>
      </div>
    </noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
